[package]
name = "sr-api"
version = "0.1.0"
edition = "2024"
authors = ["Spencer Raymond <spencer@spencerraymon.de>"]

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.8.7", features = ["http", "axum", "d1"] }
axum = { version = "0.8.9", default-features = false, features = ["json", "query", "macros"] }
tower-service = "0.3.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
utoipa = { version = "6.0.0", features = ["axum_extras"] }
utoipa-axum = "0.3.0"
garde = { version = "0.23.0", features = ["derive", "serde", "url", "pattern", "js-sys"] }
js-sys = "0.3"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = { level = "allow" }